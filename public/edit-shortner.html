<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/material-design-iconic-font@2.2.0/dist/css/material-design-iconic-font.min.css"
    />
    <title>Edit URL</title>
  </head>

  <body>
    <nav class="navbar">
      <div class="navbar-inner">
        <a href="/" class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">Welcome</span>
        </a>

        <ul class="navbar-links">
          <li><a href="/">Home</a></li>
          <li><a href="/about.html">About</a></li>
          <li><a href="/contact.html">Contact</a></li>
        </ul>

        <div class="navbar-actions" id="navbar-actions"></div>
      </div>
    </nav>

    <div class="main">
      <section class="url-shortener">
        <div class="container">
          <div class="shortener-content">
            <div class="shortener-form">
              <h1 class="form-title">Edit URL</h1>
              <form action="#" method="post" class="url-form" id="edit-form">
                <div class="form-group">
                  <label for="url">
                    <i class="zmdi zmdi-link"></i>
                  </label>
                  <input
                    type="url"
                    name="url"
                    id="url"
                    placeholder="Enter URL"
                    required
                  />
                </div>
                <div class="form-group">
                  <label for="shortCode">
                    <i class="zmdi zmdi-code"></i>
                  </label>
                  <input
                    type="text"
                    name="shortCode"
                    id="shortCode"
                    placeholder="Enter custom short code"
                    required
                  />
                </div>

                <div id="form-errors"></div>

                <div class="form-group form-button">
                  <input
                    type="submit"
                    name="shorten"
                    id="shorten"
                    class="form-submit"
                    value="Update"
                  />
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </div>

    <footer>
      <div class="container">
        <div class="copyright">
          &copy; <span id="footer-year"></span> Your Company. All rights reserved.
        </div>
        <div class="social-links">
          <a href="#"><i class="zmdi zmdi-facebook"></i></a>
          <a href="#"><i class="zmdi zmdi-twitter"></i></a>
          <a href="#"><i class="zmdi zmdi-instagram"></i></a>
          <a href="#"><i class="zmdi zmdi-linkedin"></i></a>
        </div>
      </div>
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/edit.js"></script>
  </body>
</html>
