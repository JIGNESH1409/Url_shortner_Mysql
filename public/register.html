<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Registration Form</title>
    <link
      rel="stylesheet"
      href="fonts/material-icon/css/material-design-iconic-font.min.css"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-inner">
        <a href="/" class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">Welcome</span>
        </a>

        <ul class="navbar-links">
          <li><a href="/">Home</a></li>
          <li><a href="/about.html">About</a></li>
          <li><a href="/contact.html">Contact</a></li>
        </ul>

        <div class="navbar-actions" id="navbar-actions"></div>
      </div>
    </nav>

    <div class="main">
      <section class="signup">
        <div class="container">
          <div class="signup-content">
            <div class="signup-form">
              <h2 class="form-title">Sign up</h2>
              <form action="/register" method="POST" class="register-form" id="register-form">
                <div class="form-group">
                  <label for="name">
                    <i class="zmdi zmdi-account material-icons-name"></i>
                  </label>
                  <input
                    type="text"
                    name="name"
                    id="name"
                    placeholder="Your Name"
                    required
                  />
                </div>
                <div class="form-group">
                  <label for="email"><i class="zmdi zmdi-email"></i></label>
                  <input
                    type="email"
                    name="email"
                    autocomplete="off"
                    id="email"
                    placeholder="Your Email"
                    required
                  />
                </div>
                <div class="form-group">
                  <label for="pass"><i class="zmdi zmdi-lock"></i></label>
                  <input
                    type="password"
                    name="password"
                    id="pass"
                    placeholder="Password"
                    required
                  />
                </div>

                <div id="form-errors"></div>

                <div class="form-group form-button">
                  <input
                    type="submit"
                    name="signup"
                    id="signup"
                    class="form-submit"
                    value="Register"
                  />
                </div>
              </form>
            </div>
            <div class="signup-image">
              <figure>
                <img src="images/signup-image.png.jpg" alt="sing up image" />
              </figure>
              <a href="/login" class="signup-image-link">I am already member</a>
            </div>
          </div>
        </div>
      </section>
    </div>

    <footer>
      <div class="container">
        <div class="copyright">
          &copy; <span id="footer-year"></span> Your Company. All rights reserved.
        </div>
        <div class="social-links">
          <a href="#"><i class="zmdi zmdi-facebook"></i></a>
          <a href="#"><i class="zmdi zmdi-twitter"></i></a>
          <a href="#"><i class="zmdi zmdi-instagram"></i></a>
          <a href="#"><i class="zmdi zmdi-linkedin"></i></a>
        </div>
      </div>
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
